name: garageflow_mobile
description: >-
  GarageFlow for phones. One app, two audiences: mechanics work the jobs
  assigned to them, customers book services and follow their vehicle.
publish_to: "none"
version: 1.0.0+13

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP. Chosen over `http` for interceptors — the access-token refresh in
  # core/api_client.dart is one interceptor rather than a wrapper hand-written
  # around every call site.
  dio: ^5.7.0

  # Tokens go to the Keychain / EncryptedSharedPreferences. SharedPreferences
  # is plain text on a rooted device and has no business holding a refresh
  # token.
  flutter_secure_storage: ^9.2.2

  # State. ChangeNotifier ships with Flutter and is enough for this app;
  # provider only supplies the plumbing to reach it down the widget tree.
  provider: ^6.1.2

  # Camera and gallery, for job photos.
  image_picker: ^1.1.2

  # Dates and Rs formatting, so the app agrees with the dashboard.
  intl: ^0.20.2

  # Raises a real notification on the phone — the tray entry and the heads-up
  # banner — rather than only moving the bell badge inside the app.
  #
  # Not Firebase. This displays notifications the app has already fetched for
  # itself, so it needs no google-services.json, no Google account and no
  # server key, and it works against the API exactly as it stands. What it
  # cannot do is wake a killed app: Android will not start a process for a
  # timer that is no longer running. That half needs FCM — and when FCM
  # arrives, this same package is what displays its foreground messages and
  # this same channel is the one it posts to, so none of it is thrown away.
  flutter_local_notifications: ^18.0.1

  # Maps. OpenStreetMap tiles through flutter_map — the same source the
  # dashboard uses via Leaflet, so a pin looks the same on both. No API key, no
  # billing account, and nothing to configure per platform, which is why it was
  # chosen over google_maps_flutter.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Hands a location off to whatever map app the phone has, for turn-by-turn.
  url_launcher: ^6.3.1

  # The phone's own position. Two callers: the garage directory sorts by how
  # near each workshop is, and a driver's phone reports where it is while a
  # delivery is out.
  #
  # Foreground only — see the permission comments in AndroidManifest.xml. This
  # package is capable of background tracking; the app never asks for it.
  geolocator: ^13.0.2

  # Where the profile settings live: theme, language, text size, whether the
  # app asks for a fingerprint. Plain preferences, not secrets — the tokens stay
  # in flutter_secure_storage above, and nothing here is worth encrypting.
  shared_preferences: ^2.5.5

  # Fingerprint / face unlock for the app lock. Only ever used to gate this
  # app's own screens: it authenticates against the phone's enrolled biometrics
  # and never sees or replaces the GarageFlow password.
  local_auth: ^3.0.2

  # Bikram Sambat dates. A Nepali workshop keeps its books in BS, so when the
  # app is set to Nepali every date is shown in BS — the same pairing the
  # dashboard makes with nepali-date-converter, and the two agree because both
  # are real conversion tables rather than the "add 56 years" approximation.
  nepali_utils: ^3.0.8
  google_sign_in: ^7.2.0

  # Saving a bill. The customer's copy of an invoice has to be able to leave the
  # app — to an insurer, an employer's expenses desk, or just a folder — and a
  # screenshot of a screen that scrolls is not a document.
  #
  # `pdf` writes the file, with the page built from the same bill the screen has
  # already drawn. That is deliberate: one bill layout in the app rather than a
  # Flutter one and a near-identical PDF one that drift apart. `path_provider`
  # gives somewhere to write it and `share_plus` opens the system sheet, which
  # is also the route to Files or Photos on both platforms.
  pdf: ^3.12.0
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
