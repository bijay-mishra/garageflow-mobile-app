org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is off because this project lives on D: while
# the pub cache lives on C:\Users\...\AppData\Local\Pub\Cache.
#
# The incremental compiler stores every source path *relative* to the module
# root so its caches can be moved between machines. Computing that relative path
# calls File.relativeTo, which throws on Windows when the two paths are on
# different drives — there is no relative route from D:\ to C:\. The failure
# surfaces as "Could not close incremental caches ... different roots" and kills
# the Kotlin daemon, so the build dies on any plugin written in Kotlin
# (url_launcher, image_picker, flutter_map).
#
# Turning it off costs a few seconds on a rebuild and nothing else. The
# alternatives are worse: move the project to C:, or repoint PUB_CACHE to D: and
# re-download every package. Delete this line if the project and the pub cache
# ever end up on the same drive.
kotlin.incremental=false
